version: '3.8'

services:
  postgres:
    image: postgres:18.7
    container_name: uniandes
    restart: unless-stopped
    environment:
      POSTGRES_DB: InventarioMVC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    driver: local